<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171A24" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <linearGradient id="rpmArc" x1="11" y1="32" x2="53" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="48%" stop-color="#FFFFFF" />
      <stop offset="78%" stop-color="#FF2800" />
      <stop offset="100%" stop-color="#E10600" />
    </linearGradient>
  </defs>

  <!-- Carbon PitWall Instrument Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2B3040" stroke-width="1.5" />

  <!-- Continuous Tachometer / Telemetry RPM Arc -->
  <path
    d="M 14.5 45.5 A 21 21 0 1 1 49.5 45.5"
    stroke="url(#rpmArc)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Precision Telemetry Needle Pointing to Redline -->
  <path
    d="M 29.2 35.8 L 43.5 20.5 L 34.8 40.2 Z"
    fill="#FF2800"
  />
  <circle cx="32" cy="38" r="5.2" fill="#FFFFFF" />
  <circle cx="32" cy="38" r="2.3" fill="#090A0F" />

  <!-- Bottom PitWall Sector Telemetry Bars -->
  <rect x="21.5" y="50" width="4.8" height="5.5" rx="1.5" fill="#00F5D4" />
  <rect x="29.6" y="47.5" width="4.8" height="8" rx="1.5" fill="#FFFFFF" />
  <rect x="37.7" y="45" width="4.8" height="10.5" rx="1.5" fill="#FF2800" />
</svg>
